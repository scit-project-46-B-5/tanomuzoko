<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link rel="stylesheet" href="../../static/css/globalstyles.css" th:href="@{/css/globalstyles.css}">
    <link rel="stylesheet" href="../../static/css/mypage.css" th:href="@{/css/mypage.css}">
    <link rel="stylesheet" href="../../static/css/myBoard_mypage.css" th:href="@{/css/myBoard_mypage.css}">
    <script th:src="@{/js/myBoard_mypage.js}" defer></script>
    <!-- fontawesome -->
    <script src="https://kit.fontawesome.com/b669fcd44b.js" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container">
        <div class="header" th:replace="~{fragment/header :: top-menu}"></div>

        <div class="mypage-container">
            <div th:replace="~{fragment/sidebar :: sidebar-menu}"></div>

            <!-- ✅ 메인 컨텐츠 -->
            <div class="mypage-content">
                <h1>내가 쓴 게시물</h1>

                <!-- 게시물이 없을 때 메시지 표시 -->
                <div th:if="${#lists.isEmpty(myBoard)}" class="noBoard">
                    <p>작성한 게시물이 없습니다.</p>
                </div>
                
                <!-- 게시물이 있을 때만 gallery 표시 -->
                <div th:if="${not #lists.isEmpty(myBoard)}" class="gallery">
                    <div th:each="board : ${myBoard}" class="gallery-item">
                        <a class="gallery-link" th:href="@{/board/boardDetail(boardSeq=${board.boardSeq})}">
                            <div class="img-wrapper">
                                <img th:src="@{${board.originalFileName}}" alt="게시물 이미지" />
                            </div>
                            <div class="gallery-text">
                                <h4 th:text="${board.boardTitle}"></h4>
                                <p th:text="${board.firstLineContent}"></p>
                                <span th:text="'❤️ ' + ${board.heartCount}"></span>
                            </div>
                        </a>
                    </div>
                </div>

                <!-- show-more 버튼을 myBoards의 크기가 5 이상일 때만 표시 -->
                <div class="show-more" th:if="${showMoreButton}">
                    <button class="show-more-btn">
                        <i class="fa-solid fa-angles-down"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
