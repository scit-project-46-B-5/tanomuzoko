<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link rel="stylesheet" href="../../static/css/globalstyles.css" th:href="@{/css/globalstyles.css}">
    <link rel="stylesheet" href="../../static/css/mypage.css" th:href="@{/css/mypage.css}">
    <link rel="stylesheet" href="../../static/css/reply_mypage.css" th:href="@{/css/reply_mypage.css}">
</head>
<body>
    <div class="container">
        <div class="header" th:replace="~{fragment/header :: top-menu}"></div>

        <div class="mypage-container">
            <div th:replace="~{fragment/sidebar :: sidebar-menu}"></div>

            <!-- ✅ 메인 컨텐츠 -->
            <div class="mypage-content">
                <h1>내가 쓴 댓글</h1>
                <div class="reply-list">
                    <ul>
                        <li th:each="reply : ${replies}">
                            <a th:href="@{/board/boardDetail(boardSeq=${reply.boardSeq})}" class="reply-item">
                                <span class="recipe-name" th:text="${reply.boardTitle}">게시글 제목</span>
                                <span class="reply-content" th:text="${reply.replyContent}">내가 쓴 댓글</span>
                                <span class="date" th:text="${#temporals.format(reply.createDate, 'yyyy-MM-dd')}">작성일</span>
                            </a>
                        </li>
                        <li th:if="${#lists.isEmpty(replies)}">작성한 댓글이 없습니다.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
