<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link rel="stylesheet" href="../../static/css/globalstyles.css" th:href="@{/css/globalstyles.css}">
    <link rel="stylesheet" href="../../static/css/mypage.css" th:href="@{/css/mypage.css}">
    <link rel="stylesheet" href="../../static/css/reply_mypage.css" th:href="@{/css/reply_mypage.css}">
    <!-- fontawesome -->
    <script src="https://kit.fontawesome.com/b669fcd44b.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="header" th:replace="~{fragment/header :: top-menu}"></div>

        <div class="mypage-container">
            <div th:replace="~{fragment/sidebar :: sidebar-menu}"></div>

            <!-- ✅ 메인 컨텐츠 -->
            <div class="mypage-content">
                <h1>내가 쓴 댓글</h1>
                <div class="reply-list">
                    <ul>
                        <li th:each="reply : ${replies}">
                            <a th:href="@{/board/boardDetail(boardSeq=${reply.boardSeq})}" class="reply-item">
                                <span class="recipe-name" th:text="${reply.boardTitle}">게시글 제목</span>
                                <span class="reply-content" th:text="${reply.replyContent}">내가 쓴 댓글</span>
                                <span class="date" th:text="${#temporals.format(reply.createDate, 'yyyy-MM-dd')}">작성일</span>
                            </a>
                        </li>
                    </ul>
                    <p th:if="${#lists.isEmpty(replies)}" class="noReply">작성한 댓글이 없습니다.</p>
                </div>

                <!-- 페이지네이션 (댓글이 있을 때만 표시) -->
                <div class="pagination" th:if="${totalPages > 1}">
                    <!-- "이전" 버튼 -->
                    <a th:if="${currentPage > 0}" th:href="@{/mypage/reply(page=${currentPage - 1})}">
                        <i class="fa-solid fa-caret-left"></i>
                    </a>
                
                    <!-- 페이지 번호 리스트 -->
                    <th:block th:each="pageNum : ${#numbers.sequence(startPage, endPage)}">
                        <a th:href="@{/mypage/reply(page=${pageNum})}" th:text="${pageNum + 1}"
                            th:classappend="${pageNum == currentPage} ? 'active' : ''">
                        </a>
                    </th:block>
                
                    <!-- "다음" 버튼 -->
                    <a th:if="${currentPage + 1 < totalPages}" th:href="@{/mypage/reply(page=${currentPage + 1})}">
                        <i class="fa-solid fa-caret-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
