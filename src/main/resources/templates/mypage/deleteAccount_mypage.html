<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link rel="stylesheet" href="globalstyles.css">
    <link rel="stylesheet" href="mypage.css">
    <link rel="stylesheet" href="info_mypage.css">
    <!-- fontawesome -->
    <script src="https://kit.fontawesome.com/b669fcd44b.js" crossorigin="anonymous"></script>
    <script src="./info_mypage.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- ✅ 상단 네비게이션 -->
        <div class="header">
            <div class="logo"><a href="main.html"><img src="logo.png" alt="Logo"></a></div>
            <nav class="nav">
                <a href="recommend.html">레시피 추천</a>
                <a href="#">명예의 전당</a>
                <a href="board.html">게시판</a>
            </nav>
            <a href="join.html"><div class="topBarBtn" id="joinBtn">회원가입</div></a>
            <a href="login.html"><div class="topBarBtn" id="loginBtn">로그인</div></a>
            <div class="topBarBtn" id="logoutBtn">로그아웃</div>
        </div>

        <div class="mypage-container">
            <!-- ✅ 마우스 오버 시 확장되는 사이드바 -->
            <div class="sidebar">
                <ul>
                    <li><a href="./recipeSave_mypage.html"><span>📂</span> 내가 저장한 기록</a></li>
                    <li><a href="./myBoard_mypage.html"><span>📝</span> 내가 쓴 게시물</a></li>
                    <li><a href="./reply_mypage.html"><span>💬</span> 내가 쓴 댓글</a></li>
                    <li><a href="./likedBoard_mypage.html"><span>❤️</span> 공감한 게시물</a></li>
                    <li><a href="./info_mypage.html"><span>🔑</span> 내 정보 관리</a></li>
                    <li><a href="./deleteAccount_mypage.html"><span>⚙️</span> 회원 탈퇴</a></li>
                </ul>
            </div>

            <!-- ✅ 메인 컨텐츠 -->
            <div class="mypage-content">
                <h1>내 정보 관리</h1>
                <div class="content-box">
                    <div class="myInfo">
                        <label for="id">
                            <span class="labelName">아이디</span>
                            <input type="text" id="id" disabled>
                        </label>

                        <label for="nickName">
                            <span class="labelName">닉네임</span>
                            <input type="text" id="nickName">
                        </label>

                        <label for="pw">
                            <span class="labelName">비밀번호</span>
                            <input type="password" id="pw" class="password">
                            <div class="pwIconBox"></div>

                            <button class="change-pw-btn" disabled>변경하기</button>
                        </label>

                       <div class="new-password-section">
                            <label for="newPW">
                                <span class="labelName">새로운 비밀번호</span>
                                <input type="password" id="newPW" placeholder="새 비밀번호 입력" />
                            </label>

                            <label for="newPWCheck">
                                <span class="labelName"> 비밀번호 확인</span>
                                <input type="password" id="newPWCheck" placeholder="비밀번호 확인" />
                            </label>
                        </div>

                        <!-- 이메일 인증하면 인증버튼 생성 필요 -->
                        <label for="email">
                            <span class="labelName">이메일</span>
                            <input type="email" id="email" disabled>
                        </label>
                    </div>

                    <div class="footer">
                        <button class="changeInfoBtn" disabled >정보 변경</button>
                    </div>

                    <div class="progress-container">
                        <p class="progress-text">정보 변경 중...</p>
                        <div class="progress-bar"></div>
                    </div>
                </div>
            </div>

            <!-- 모달 창 -->
            <div class="modal" id="myModal">
                <div class="modal-content">
                    <span class="close" id="closeModal">&times;</span>
                    <h2>알림</h2>
                    <p>닉네임 또는 비밀번호를 확인해 주세요.</p>
                    <button id="modalButton">확인</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const password = document.querySelector(".password");
        const pwIconBox = document.querySelector(".pwIconBox"); 
        const changePwBtn = document.querySelector(".change-pw-btn");
        const newPasswordSection = document.querySelector(".new-password-section");
        
        const newPW = document.querySelector("#newPW");
        const newPWCheck = document.querySelector("#newPWCheck");
        const nickName = document.querySelector("#nickName");
        const changeInfoBtn = document.querySelector(".changeInfoBtn");
        
        const correctPw = '1234'; //*** 비밀번호로 변경하기

        // 새 비밀번호 입력란 숨기기
        newPasswordSection.style.display = "none";

        // 비밀번호 입력 확인
        document.addEventListener("keyup", validateForm);

        function checkPw() {
            if(password.value.length !== 0) {
                if(password.value === correctPw) { 
                    changePwBtn.disabled = false;
                    pwIconBox.innerHTML = `<i class="fa-solid fa-circle-check pwCheckIcon" style="color: #5cd85a;"></i>`;
                } else {
                    changePwBtn.disabled = true;
                    pwIconBox.innerHTML = `<i class="fa-solid fa-circle-xmark pwCheckIcon" style="color: #f55735;"></i>`;
                }
            } else {
                pwIconBox.innerHTML= "";
                changePwBtn.disabled = true; 
            }
        }

        // 새 비밀번호 확인
        function checkNewPw() {
            if (newPW.value.length !== 0 && newPW.value === newPWCheck.value) {
                newPWCheck.style.borderBottom = "2px solid #5cd85a";
            } else {
                newPWCheck.style.borderBottom = "2px solid #f55735";
            }
    }
        // 변경하기 버튼 클릭 시 새 비밀번호 입력란 표시/숨김
        changePwBtn.addEventListener("click", function () {
            if (newPasswordSection.style.display === "none") {
                newPasswordSection.style.display = "block";
                changePwBtn.innerText = "취소";
                changePwBtn.style.backgroundColor = "#f55735";
                password.disabled = true;
            } else {
                newPW.value = "";
                newPWCheck.value = "";
                newPWCheck.style.borderBottom = "none"; 
                newPasswordSection.style.display = "none";
                changePwBtn.innerText = "변경하기";
                changePwBtn.style.backgroundColor = "#5cd85a";
                password.disabled = false;
                changeInfoBtn.disabled = true;
            }
            validateForm();
        });


        // 정보 변경 버튼 활성화 조건 확인
        function validateForm() {
            const isPwCorrect = password.value === correctPw;
            const isNewPwValid = newPW.value.length > 0 && newPW.value === newPWCheck.value;
            const isNickNameValid = nickName.value.trim().length > 0;

            if (newPasswordSection.style.display === "none") {
                // 비밀번호 변경 없이 닉네임만 변경하는 경우
                changeInfoBtn.disabled = !(isPwCorrect && isNickNameValid);
            } else {
                // 비밀번호도 변경하는 경우
                changeInfoBtn.disabled = !(isNickNameValid && isNewPwValid);
            }
        }

        password.addEventListener("keyup", checkPw);
        newPW.addEventListener("keyup", checkNewPw);
        newPWCheck.addEventListener("keyup", checkNewPw);
        nickName.addEventListener("keyup", validateForm);

    </script>
</body>
</html>
