<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link rel="stylesheet" href="../../static/css/globalstyles.css" th:href="@{/css/globalstyles.css}">
    <link rel="stylesheet" href="../../static/css/mypage.css" th:href="@{/css/mypage.css}">
    <link rel="stylesheet" href="../../static/css/myBoard_mypage.css"  th:href="@{/css/myBoard_mypage.css}">
    <script th:src="@{/js/likedBoard_mypage.js}" defer ></script>
    <!-- fontawesome -->
    <script src="https://kit.fontawesome.com/b669fcd44b.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="header" th:replace="~{fragment/header :: top-menu}"></div>

        <div class="mypage-container">
            <div th:replace="~{fragment/sidebar :: sidebar-menu}"></div>

            <!-- ✅ 메인 컨텐츠 -->
            <div class="mypage-content">
                <div class="gallery">
                    <div th:each="board : ${likedBoards}" class="gallery-item">
                        <a class="gallery-link" href="#">
                            <div class="img-wrapper">
                                <img th:src="@{${board.originalFileName}}" alt="${board.boardTitle}" />
                            </div>
                            <div class="gallery-text">
                                <h4 th:text="${board.boardTitle}"></h4>
                                <p th:text="${board.boardContent}"></p>
                                <span th:text="'❤️ ' + ${board.heartCount}"></span>
                            </div>
                        </a>
                    </div>
                </div>

                <!-- show-more 버튼을 likedBoards의 크기가 4 이상일 때만 표시 -->
                <div class="show-more" th:if="${#lists.size(likedBoards) >= 4}">
                    <button class="show-more-btn">
                        <i class="fa-solid fa-angles-down"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
