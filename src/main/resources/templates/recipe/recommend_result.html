<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>추천된 레시피</title>
        <!-- 내부 import -->
        <link rel="stylesheet"  th:href="@{/css/globalstyles.css}" />
        <link rel="stylesheet"  th:href="@{/css/globalstyles.css}" />
        <script th:src="@{/js/recommend_result.js}" defer></script>
        <!-- 결과 페이지 스타일 -->
    </head>
    <body>
        <div class="container">
            <div class="container" th:replace="fragment/header :: top-menu"></div>

            <!-- ✅ 레시피 결과 컨테이너 -->
            <div class="recipe-container">
                <h1>추천된 레시피</h1>

                <!-- ✅ 레시피 카드 -->
                <div class="recipe-card">
                    <!-- ⭐ 즐겨찾기 버튼 (우측 상단 배치) -->
                    <button class="bookmark-btn" onclick="toggleBookmark()">
                        <img th:src="@{/image/star1.png}" alt="즐겨찾기" id="bookmarkIcon" />
                    </button>

                    <div class="recipe-info">
                        <h2>닭볶음탕</h2>

                        <h3>🍽️ 재료</h3>
                        <ul>
                            <li>닭 1마리</li>
                            <li>감자 2개</li>
                            <li>당근 1개</li>
                            <li>양파 1개</li>
                            <li>고추장 3큰술</li>
                            <li>간장 4큰술</li>
                            <li>설탕 2큰술</li>
                            <li>다진 마늘 1큰술</li>
                        </ul>

                        <h3>👨‍🍳 만드는 방법</h3>
                        <ol>
                            <li>닭을 깨끗이 씻어 물에 5분간 데친 후 헹궈줍니다.</li>
                            <li>감자, 당근, 양파를 적당한 크기로 썰어줍니다.</li>
                            <li>냄비에 닭과 양념장을 넣고 10분간 볶아줍니다.</li>
                            <li>물을 넣고 끓이며 감자와 당근을 넣고 20분간 조립니다.</li>
                            <li>양파를 넣고 5분 더 끓인 후 맛있게 즐깁니다!</li>
                        </ol>
                    </div>
                </div>

                <!-- ✅ 다시 추천받기 버튼 -->
                <div class="footer">
                    <button onclick="window.location.href='/src/main/resources/templates/index.html'">
                        메인페이지
                    </button>
                    <button onclick="window.location.href='recommend.html'">다시 추천받기</button>
                    <button onclick="window.location.href='/src/main/resources/templates/user/mypage.html'">
                        나의 레시피
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
