<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>추천된 레시피</title>
        <!-- 내부 import -->
        <link rel="stylesheet"  th:href="@{/css/globalstyles.css}" />
        <link rel="stylesheet"  th:href="@{/css/globalstyles.css}" />
        <script th:src="@{/js/recommend_result.js}" defer></script>
        <!-- 결과 페이지 스타일 -->
    </head>
    <body>
        <div class="container">
            <div class="header" th:replace="/fragment/header :: top-menu"></div>

            <!-- ✅ 레시피 결과 컨테이너 -->
            <div class="recipe-container">
                <h1>추천된 레시피</h1>

                <!-- ✅ 레시피 카드 -->
                <div class="recipe-card">
                    <!-- ⭐ 즐겨찾기 버튼 (우측 상단 배치) -->
                    <button class="bookmark-btn" onclick="toggleBookmark()">
                        <img th:src="@{/image/star1.png}" alt="즐겨찾기" id="bookmarkIcon" />
                    </button>

                    <div class="recipe-info">
                        <h2 th:text="${recipe.title}"></h2>

                        <h3>🍽️ 재료</h3>
                        <ul >
                            <li th:each="item, status : ${recipe.ingredients}" th:text="${item}"></li>
                        </ul>

                        <h3>👨‍🍳 만드는 방법</h3>
                        <ol>
                            <li th:each="item, status : ${recipe.cookingMethod}" th:text="${item}"></li>
                        </ol>
                    </div>
                </div>

                <!-- ✅ 다시 추천받기 버튼 -->
                <div class="footer">
                    <button onclick="window.location.href='/src/main/resources/templates/index.html'">
                        메인페이지
                    </button>
                    <button onclick="window.location.href='recommend.html'">다시 추천받기</button>
                    <button onclick="window.location.href='/src/main/resources/templates/user/mypage.html'">
                        나의 레시피
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
