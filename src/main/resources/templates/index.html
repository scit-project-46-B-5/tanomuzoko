<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <!-- 부트스트랩 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="../../static/css/list.css" th:href="@{/css/list.css}">

    <!-- jquery -->
    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
    <script defer>
        $(function () {
        	
        	let currentPage = 0;
            init(currentPage);
            
            $('#show-more-button').click(function() {
                currentPage++;
                init(currentPage);
            });
        })

        function init(page) {
            $.ajax({
                url: '/posts?page=' + page,
                method: 'GET',
                success: output
            });
        }

        function output(resp) {

            let tag = ``;

            $.each(resp, function (index, item) {
                tag += `
                <div class="gallery-item">
                    <a class="gallery-link" href="#">
                        <img src="" alt="레시피">
                        <div class="gallery-text">
                            <h4>${item['boardTitle']}</h4>
                            <p>${item['boardContent']}</p>
                            <span>❤️ 56</span>
                        </div>
                    </a>
                </div>
                        `
            });
            
            if (resp.length > 0) {
                $('.gallery').append(tag);
            } else {
            	$('#show-more-button').hide(); 
               // $('#show-more-button').prop('disabled', true);
            }
        }
    </script>

</head>

<body>

    <a th:href="@{/board/board}" class="btn btn-primary">게시판</a>

    <div class="gallery">
        <!-- AJAX로 동적으로 게시글 추가 -->
    </div>
	
    <div class="show-more">
        <button id="show-more-button">더보기</button>
    </div>


</body>

</html>
