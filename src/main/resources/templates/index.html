<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index</title>
    <!-- 부트스트랩 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../static/css/globalstyles.css" th:href="@{/css/globalstyles.css}" />
    <link rel="stylesheet" href="../static/css/index.css" th:href="@{/css/index.css}" />

    <!-- jquery -->
    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
    <script defer th:src="@{/js/main.js}"></script>
    <!-- Slick CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />
    <!-- Slick js -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

    <!-- index.js -->
    <script th:src="@{/js/index.js}"></script>

    <script defer>
        $(function () {

            let currentPage = 0;
            let currentFilter = "weekly"; // 기본값: 최신 게시글

            // 초기 로드 (최신 게시글 + 인기 게시글)
            initRecentPosts(currentPage);
            initPopularPosts("weekly"); // 기본값: 주간 인기글

            // "더보기" 버튼 클릭 시 추가 최신 게시글 로드
            $('#show-more-button').click(function () {
                currentPage++;
                initRecentPosts(currentPage);
            });

            // "주간 인기글" 버튼 클릭 시
            $('#weekly-button').click(function () {
                initPopularPosts("weekly");
            });

            // "월간 인기글" 버튼 클릭 시
            $('#monthly-button').click(function () {
                initPopularPosts("monthly");
            });

        });

        function initRecentPosts(page) {
            $.ajax({
                url: '/posts?page=' + page,
                method: 'GET',
                success: outputRecentPosts
            });
        }

        // 주간/월간 인기 게시글 불러오기
        function initPopularPosts(filter) {
            $.ajax({
                url: `/top-posts?filter=${filter}`,
                method: 'GET',
                success: outputPopularPosts
            });
        }

        function outputRecentPosts(resp) {

            let tag = ``;

            $.each(resp, function (index, item) {
                tag += `
                    <div class="gallery-item">
                        <a class="gallery-link" href="/board/boardDetail?boardSeq=${item['boardSeq']}">
                            <img src="" alt="레시피">
                            <div class="gallery-text">
                                <h4>${item['boardTitle']}</h4>
                                <p>${item['boardContent']}</p>
                                <span>❤️ ${item['heartCount']}</span>
                            </div>
                        </a>
                    </div>
                            `
            });
            $('.recentPost').append(tag);

            if (resp.length < 10) {
                $('#show-more-button').hide();
                // $('#show-more-button').prop('disabled', true);
            }
        }




        // 인기 게시글 출력
        function outputPopularPosts(resp) {
            let tag = ``;
            $.each(resp, function (index, item) {
                tag += `
            <div class="gallery-item">
                <a class="gallery-link" href="/board/boardDetail?boardSeq=${item['boardSeq']}">
                    <img src="" alt="레시피">
                    <div class="gallery-text">
                        <h4>${item['boardTitle']}</h4>
                        <p>${item['boardContent']}</p>
                        <span>❤️ ${item['heartCount']}</span>
                    </div>
                </a>
            </div>
        `;
            });
            $('.popularPost').html(tag); // 기존 목록 초기화 후 새로 채우기
        }
    </script>
</head>

<body>
    <!-- fragment/headerr사용하는 코드 -->
    <div class="container">
        <div class="header" th:replace="/fragment/header :: top-menu"></div>
        <div class="cards">
            <a class="card" href="/src/main/resources/templates/recipe/recommend.html">
                <img src="https://imagescdn.gettyimagesbank.com/500/201703/a10679449.jpg" alt="이벤트 이미지" />
                <div class="card-content">
                    <p>RECIPE</p>
                    <h4>
                        오늘은 나도 집종원<br />
                        레시피 추천받기
                    </h4>
                    <button>
                        레시피 추천 받기
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            width="16">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </div>
            </a>
            <a class="card" th:href="@{/board/board}">
                <img src="https://imagescdn.gettyimagesbank.com/500/201703/a10679449.jpg" alt="이벤트 이미지" />
                <div class="card-content">
                    <p>BOARD</p>
                    <h4>
                        내일은 나도 집종원<br />
                        공유레시피 보러가기
                    </h4>
                    <button>
                        레시피 보러가기
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            width="16">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </div>
            </a>
        </div>
        <div class="slider">
            <div>
                <div class="footer">
                    <div class="badge">랭킹 2위</div>
                    <span>가성비 甲 요리도 가능한 된장찌개 만들기!</span>
                    <a href="/src/main/resources/templates/board/detail.html">게시글 바로가기 →</a>
                </div>
            </div>
            <!-- 다른 슬라이드 항목들 추가 -->
            <div>
                <div class="footer">
                    <div class="badge">랭킹 1위</div>
                    <span>손쉬운 초간단 떡볶이 레시피!</span>
                    <a href="/src/main/resources/templates/board/detail.html">게시글 바로가기 →</a>
                </div>
            </div>
            <div>
                <div class="footer">
                    <div class="badge">랭킹 3위</div>
                    <span>건강하게 즐길 수 있는 샐러드 레시피!</span>
                    <a href="/src/main/resources/templates/board/detail.html">게시글 바로가기 →</a>
                </div>
            </div>
            <!-- 필요한 만큼 추가 -->
    </div>
    <div class="popular-recipes">
        <h2>인기 레시피</h2>
        <p>최근 인기 레시피를 공유 받아 직접 만들어보세요</p>
        <div class="filters">
            <button id="weekly-button" data-period="weekly" style="background-color: black; color: white">주간</button>
            <button id="monthly-button" data-period="monthly">월간</button>
        </div>
        <div class="gallery popularPost">
            <!-- AJAX로 게시글 추가 -->
        </div>
    </div>

        <div class="popular-recipes">
            <h2>최신 레시피</h2>
            <p>최근 공유된 레시피를 공유 받아 직접 만들어보세요</p>

            <div class="gallery recentPost">
                <!-- AJAX로 동적으로 게시글 추가 -->
            </div>

            <div class="show-more">
                <button id="show-more-button"><img src="../../static/image/down-arrow.png"
                        th:src="@{/image/down-arrow.png}" alt="더보기"></button>
            </div>
        </div>
    </div>
</body>

</html>
