<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레시피 상세 페이지</title>
    <link rel="stylesheet" href="../../static/css/globalstyles.css" th:href="@{/css/globalstyles.css}" />
    <link rel="stylesheet" href="../../static/css/detail.css" th:href="@{/css/detail.css}"/>
    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/detail.js}" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.16.0/dist/sweetalert2.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.16.0/dist/sweetalert2.all.min.js"></script>
    <!-- fontawesome -->
    <script src="https://kit.fontawesome.com/b669fcd44b.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="header" th:replace="~{fragment/header :: top-menu}"></div>
    </div>
    <div class="content-wrapper">
        <div class="sidebar">
            <div class="sidebar-wrapper">
                <div class="ranking-section">
                    <h3>🔥 인기 랭킹</h3>
                    <div class="popular-item" th:each="post, iterStat : ${popularPosts}">
                        <a th:href="@{'/board/boardDetail?boardSeq=' + ${post.boardSeq}}">
                            <span th:text="${iterStat.index + 1} + '. ' + ${post.boardTitle}">1. 게시글 제목</span>
                        </a>
                    </div>
                </div>
                <div class="author-section">
                    <h3>✍️ 작성자의 다른 글</h3>
                    <ul class="author-posts">
                        <li th:each="post : ${recentPosts}">
                            <a th:href="@{'/board/boardDetail?boardSeq=' + ${post.boardSeq}}"
                                th:text="${post.boardTitle}">게시글 제목</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="recipe-comment-box">
            <div class="recipe-detail">
                <input type="hidden" th:value="${board.boardSeq}" id="boardSeq">
                <h1 class="recipe-title" th:text="${board.boardTitle}">레시피 제목</h1>
                
                <div class="meta">
                    <span>📅 [[${#temporals.format(board.createDate, 'yyyy-MM-dd')}]]</span> | 
                    <span>✍️ 작성자: <span id="author-name" th:text="${board.boardWriter}"></span></span> |
                    <span> 👍 조회수: <span id="hit-count" th:text="${board.hitCount}"></span></span>
                </div>
                
                <!-- 게시물 내용 출력 -->
                <div th:utext="${board.boardContent}"></div>
				
				<!-- 레시피 내용 출력 -->
                <p class="recipe-content" th:utext="${recipeOutputContent}"></p>
                
                <!-- 로그인한 사용자의 아이디를 hidden으로 저장 (Ajax에서 사용) -->
                <th:block sec:authorize="isAuthenticated()">
                    <input type="hidden" th:value="${#authentication.name}" id="loginId">
                </th:block>
                
                <div class="btn-wrapper">
                    <button id="like-btn">
                        ❤️ <span>공감 </span><span id="like-count">0</span>
                    </button>
                    <!-- Ajax로 수정/삭제 버튼이 출력될 영역 -->  
                    <div class="upadteAndDelete-btn" id="upadteAndDelete-btn"></div>
                </div>
            </div>
            <div class="comment-wrapper">
                <h2>댓글</h2>
                <th:block sec:authorize="isAuthenticated()">  
                    <div class="comment-box">
                        <input type="text" id="comment-input" placeholder="댓글을 입력하세요" />
                        <button onclick="addReply()">등록</button>
                    </div>
                </th:block>
                <div class="comment-list" id="comment-list"></div>
                <div class="pagination-container">
                    <div id="pagination"></div>
                </div>
            </div>
        </div>
        <div class="ad-section">
            <div class="top-ad">
                <h3>📢 광고</h3>
                <img src="https://martmonster.com/files/attach/images/250807/983/059/7586795418ec6e3d14d92097b0c3111f.jpg" alt="광고 이미지" />
            </div>
            <div class="bottom-ad">
                <h3>📢 광고</h3>
                <img src="https://martmonster.com/files/attach/images/250807/983/059/7586795418ec6e3d14d92097b0c3111f.jpg" alt="광고 이미지" />
            </div>
        </div>
    </div>
</body>
</html>
