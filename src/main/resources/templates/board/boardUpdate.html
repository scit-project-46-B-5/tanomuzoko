<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>게시글 수정하기</title>
	<link rel="stylesheet" th:href="@{/css/globalstyles.css}" href="../../static/css/globalstyles.css" />
	<link rel="stylesheet" th:href="@{/css/postwriting.css}" href="../../static/css/postwriting.css" />
	<link rel="stylesheet" th:href="@{/css/boardUpdate.css}" href="../../static/css/boardUpdate.css" />

	<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
	<script th:src="@{/js/boardUpdate.js}" defer></script>

	<!-- Quill 에디터 & Dropzone 라이브러리 -->
	<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
	<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />

	<!-- 이미지 리사이즈 모듈 (Quill Image Resize Module) CDN -->
	<script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>

	<script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
	<link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />

	<!-- 외부 alert import -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.16.0/dist/sweetalert2.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.16.0/dist/sweetalert2.all.min.js"></script>
</head>

<body>
	<div class="container">
		<!-- header fragment 삽입 -->
		<div class="header" th:replace="~{fragment/header :: top-menu}"></div>

		<div class="board-container">
			<h2>게시글 수정하기</h2>
			<form id="board-form" th:action="@{/board/boardUpdate}" method="POST" enctype="multipart/form-data">
				<!-- boardSeq: 기존 글 식별 -->
				<input type="hidden" name="boardSeq" th:value="${board.boardSeq}" />
				<!-- 기존 썸네일 정보를 hidden 필드에 미리 채움 -->
				<input type="hidden" name="thumbnail" id="thumbnail" th:value="${board.thumbnail}" />
				<input type="hidden" name="thumbnailUrl" id="thumbnailUrl" th:value="${board.thumbnailUrl}" />

				<div class="form-group">
					<label for="boardTitle">게시글 제목 :</label>
					<input type="text" id="boardTitle" name="boardTitle" th:value="${board.boardTitle}" required />
				</div>

				<!-- Quill 에디터 영역 (기존 boardContent 값 표시) -->
				<div class="form-group">
					<label for="boardContent">내용 작성 :</label>
					<div id="editor-container" th:utext="${board.boardContent}"></div>
					<input type="hidden" name="boardContent" id="boardContent" />
				</div>

				<!-- Dropzone 파일 업로드 영역 -->
				<div class="form-group">
					<label for="dropzone">사진 업로드 (썸네일 선택) :</label>
					<div class="dropzone" id="dropzone">
						<div class="dz-message">
							<img class="camera-icon"
								src="https://www.freeiconspng.com/uploads/------------------------------iconpngm--22.png"
								alt="Camera" />
							<span class="text-message">여기로 파일을 드래그하거나 클릭하여 업로드하세요!</span>
						</div>
						<span class="plus">+</span>
					</div>
				</div>

				<button type="submit" class="submit-btn">등록하기</button>
			</form>
		</div>
	</div>

</body>

</html>
