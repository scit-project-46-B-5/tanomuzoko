<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시글 작성</title>
  <link rel="stylesheet" th:href="@{/css/globalstyles.css}" href="../../static/css/globalstyles.css" />
  <link rel="stylesheet" th:href="@{/css/postwriting.css}" href="../../static/css/postwriting.css" />

  <!-- Quill 에디터 & Dropzone 라이브러리 -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />

  <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />

  <style>
    /* 드롭 영역 스타일 */
    .dropzone {
      border: 2px dashed #ccc;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      margin-top: 10px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
      border-radius: 10px;
      position: relative;
    }

    /* 카메라 아이콘 */
    .camera-icon {
      width: 60px;
      height: 60px;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    /* Dropzone 내 파일 업로드 시 아이콘 숨김 */
    .dropzone.dz-clickable.dz-started .camera-icon {
      display: none;
    }

    /* + 아이콘 */
    .plus {
      font-size: 30px;
      font-weight: bold;
      color: #999;
    }

    /* Quill 에디터 */
    #editor-container {
      width: 100%;
      min-height: 300px;
      border: 1px solid #ccc;
      cursor: text;
    }

    /* 썸네일 선택된 미리보기 스타일 */
    .selected-thumbnail {
      border: 3px solid #007bff !important;
    }

    /* 썸네일 선택 버튼 스타일 */
    .thumbnail-btn {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 5px;
    }

    .thumbnail-btn:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <div class="logo">
        <a href="main.html"><img th:src="@{/image/logo.png}" alt="Logo" /></a>
      </div>
      <nav class="nav">
        <a href="recommend.html">레시피 추천</a>
        <a href="board.html">게시판</a>
      </nav>
      <a href="join.html">
        <div class="topBarBtn">회원가입</div>
      </a>
      <a href="login.html">
        <div class="topBarBtn">로그인</div>
      </a>
      <div class="topBarBtn">로그아웃</div>
    </div>

    <!-- 게시글 작성 영역 -->
    <div class="board-container">
      <h2>게시글 작성하기</h2>
      <form id="board-form" th:action="@{/board/boardWrite}" method="POST" enctype="multipart/form-data">

        <div class="form-group">
          <label for="boardTitle">게시글 제목 :</label>
          <input type="text" id="boardTitle" name="boardTitle" required />
        </div>

        <!-- Quill 에디터 -->
        <div class="form-group">
          <label for="content">내용 작성 :</label>
          <div id="editor-container"></div>
          <input type="hidden" name="boardContent" id="boardContent" />
        </div>

        <!-- Dropzone 파일 업로드 -->
        <div class="form-group">
          <label for="dropzone">사진 업로드 :</label>
          <div class="dropzone" id="dropzone">
            <img class="camera-icon"
              src="http://www.freeiconspng.com/uploads/------------------------------iconpngm--22.png"
              alt="Camera" />
            <span class="plus">+</span>
          </div>
          <!-- 선택한 썸네일 이미지 URL을 저장할 숨겨진 필드 -->
          <input type="hidden" name="thumbnailImage" id="thumbnailImage" value="" />
        </div>

        <button type="submit" class="submit-btn">등록하기</button>
      </form>
    </div>
  </div>

  <script>
    // Quill 에디터 초기화
    var quill = new Quill('#editor-container', {
      theme: 'snow',
    });

    // 에디터 컨테이너 클릭 시 에디터 포커스 처리
    document.getElementById('editor-container').addEventListener('click', function () {
      quill.focus();
    });

    // 폼 제출 시 에디터 내용을 boardContent 필드에 저장
    document.querySelector('form').onsubmit = function () {
      document.querySelector('#boardContent').value = quill.root.innerHTML;
    };

    // 업로드된 파일 리스트 저장 (파일 고유 키: file.name + file.size)
    let uploadedFiles = new Map();

    // cameraIcon 미리 선언
    const cameraIcon = document.querySelector('.camera-icon');

    // Dropzone 자동 초기화 비활성화
    Dropzone.autoDiscover = false;

    const dropzone = new Dropzone('#dropzone', {
      url: 'C/uploadPath/', // 🚀 실제 업로드 서버 주소로 변경하세요.
      maxFiles: 5, // 최대 업로드 가능 개수
      maxFilesize: 5, // 최대 파일 크기 (MB)
      acceptedFiles: 'image/*',
      addRemoveLinks: true, // 삭제 버튼 활성화
      dictDefaultMessage: '여기로 파일을 드래그하거나 클릭하여 업로드하세요!',
      dictRemoveFile: '삭제',

      init: function () {
        this.on('addedfile', function (file) {
          let fileKey = file.name + file.size;
          if (uploadedFiles.has(fileKey)) {
            console.warn('중복된 파일입니다:', file.name);
            alert('이미 업로드된 파일입니다.');
            this.removeFile(file); // Dropzone에서 파일 삭제
            return;
          }

          // 업로드가 시작되면 dropzone에 'dz-started' 클래스 추가
          this.element.classList.add('dz-started');

          // 파일이 하나 이상이면 카메라 아이콘 숨김
          if (this.files.length > 0 && cameraIcon) {
            cameraIcon.style.display = "none";
          }

          // --- 썸네일 선택 버튼 추가 ---
          let thumbnailBtn = document.createElement('button');
          thumbnailBtn.textContent = "썸네일 선택";
          thumbnailBtn.type = "button"; // 버튼 클릭시 폼 제출 방지
          thumbnailBtn.classList.add("thumbnail-btn");
          thumbnailBtn.addEventListener("click", function (e) {
            e.preventDefault();
            // 다른 파일들의 선택 표시 제거
            dropzone.files.forEach(function (f) {
              if (f.previewElement) {
                f.previewElement.classList.remove("selected-thumbnail");
              }
            });
            // 현재 파일을 선택 표시로 지정
            file.previewElement.classList.add("selected-thumbnail");
            // 업로드된 파일 URL을 hidden 필드에 저장 (업로드 완료 후 저장된 데이터 사용)
            let fileKey = file.name + file.size;
            let fileData = uploadedFiles.get(fileKey);
            if (fileData) {
              document.querySelector("#thumbnailImage").value = fileData.url;
            }
          });
          // 썸네일 버튼을 미리보기 영역에 추가
          file.previewElement.appendChild(thumbnailBtn);
        });

        this.on('success', function (file, response) {
          console.log('업로드 완료:', response);
          // 이미지 파일인 경우
          if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function (e) {
              let range = quill.getSelection();
              let insertIndex = range ? range.index : quill.getLength();

              // Quill 에디터에 이미지 삽입
              quill.insertEmbed(insertIndex, 'image', e.target.result);
              quill.setSelection(insertIndex + 1);

              // Dropzone 미리보기와 삭제 기능을 위해 파일 정보 저장
              file.previewElement.setAttribute('data-file-id', e.target.result);
              uploadedFiles.set(file.name + file.size, { file, url: e.target.result });

              // 미리보기 상태 유지
              file.previewElement.classList.add('dz-complete');
              this.element.classList.add('dz-started');
            }.bind(this);
            reader.readAsDataURL(file);
          }
        });

        this.on('error', function (file, errorMessage) {
          console.error('업로드 실패:', errorMessage);
        });

        this.on('removedfile', function (file) {
          console.log('Dropzone에서 파일 삭제됨:', file.name);
          let fileKey = file.name + file.size;
          let fileData = uploadedFiles.get(fileKey);
          if (fileData) {
            // 삭제된 파일이 썸네일로 선택되어 있다면 hidden 필드 초기화
            if (document.querySelector("#thumbnailImage").value === fileData.url) {
              document.querySelector("#thumbnailImage").value = "";
            }
          }
          // 파일 리스트에서 제거
          uploadedFiles.delete(fileKey);

          // 모든 파일이 삭제되면 카메라 아이콘 다시 보이게 하기
          if (this.files.length === 0 && cameraIcon) {
            cameraIcon.style.display = "";
          }
        });

        this.on('complete', function (file) {
          file.previewElement.classList.add('dz-complete');
          this.element.classList.add('dz-started');
        });
      },
    });

    // Quill 에디터에서 이미지 삭제 감지 시, Dropzone에서도 삭제 처리
    quill.on('text-change', function () {
      let quillImages = new Set([...quill.root.querySelectorAll('img')].map((img) => img.src));

      for (let [fileKey, { file, url }] of uploadedFiles.entries()) {
        if (!quillImages.has(url)) {
          console.log('Quill에서 이미지 삭제됨:', url);
          dropzone.removeFile(file); // Dropzone에서 해당 파일 삭제
          uploadedFiles.delete(fileKey);
        }
      }

      // 모든 파일이 삭제되었으면 dropzone 상태 및 카메라 아이콘 초기화
      if (uploadedFiles.size === 0 && cameraIcon) {
        dropzone.element.classList.remove('dz-started');
        cameraIcon.style.display = "";
      }
    });
  </script>
</body>

</html>
