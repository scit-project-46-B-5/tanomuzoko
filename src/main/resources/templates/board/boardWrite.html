<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시글 작성</title>
  <link rel="stylesheet" th:href="@{/css/globalstyles.css}" href="../../static/css/globalstyles.css" />
  <link rel="stylesheet" th:href="@{/css/postwriting.css}" href="../../static/css/postwriting.css" />

  <!-- Quill 에디터 & Dropzone 라이브러리 -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />

  <!-- 이미지 리사이즈 모듈 (Quill Image Resize Module) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>

  <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />

  <style>
    /* 드롭존 영역 스타일 */
    .dropzone {
      border: 2px dashed #ccc;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      margin-top: 10px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
      border-radius: 10px;
      position: relative;
    }

    /* 기본 메시지 영역 (카메라 아이콘 + 안내 문구) */
    .dz-message {
      text-align: center;
      pointer-events: none; /* 클릭 불가 영역 */
    }
    .dz-message img.camera-icon {
      width: 60px;
      height: 60px;
      opacity: 0.7;
      transition: opacity 0.3s ease;
      display: block;
      margin: 0 auto 5px auto;
    }
    .dz-message .text-message {
      font-size: 16px;
      color: #999;
      display: block;
    }

    /* + 아이콘은 별도 span으로 두어 계속 유지 */
    .plus {
      font-size: 30px;
      font-weight: bold;
      color: #999;
      margin-top: 10px;
    }

    /* 파일이 하나라도 있으면 dz-started가 붙어 .dz-message 숨김 */
    .dropzone.dz-started .dz-message {
      display: none;
    }

    /* Quill 에디터 */
    #editor-container {
      width: 100%;
      min-height: 300px;
      border: 1px solid #ccc;
      cursor: text;
    }

    /* Dropzone 미리보기 스타일 */
    .dz-preview {
      position: relative;
    }
    .thumbnail-selected {
      border: 3px solid #ff6b6b;
      padding: 2px;
    }
    .thumbnail-label {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 12px;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- fragment/headerr사용하는 코드 -->
	<div class="container" th:replace="fragment/header :: top-menu"></div>
  
    <div class="board-container">
      <h2>게시글 작성하기</h2>
      <form id="board-form" th:action="@{/board/boardWrite}" method="POST" enctype="multipart/form-data">
        <div class="form-group">
          <label for="boardTitle">게시글 제목 :</label>
          <input type="text" id="boardTitle" name="boardTitle" required />
        </div>

        <!-- Quill 에디터 영역 -->
        <div class="form-group">
          <label for="content">내용 작성 :</label>
          <div id="editor-container"></div>
          <input type="hidden" name="boardContent" id="boardContent" />
        </div>

        <!-- Dropzone 파일 업로드 영역 -->
        <div class="form-group">
          <label for="dropzone">사진 업로드 :</label>
          <div class="dropzone" id="dropzone">
            <!-- 카메라 아이콘 + 안내 문구는 .dz-message 안에만 배치 -->
            <div class="dz-message">
              <img class="camera-icon"
                   src="http://www.freeiconspng.com/uploads/------------------------------iconpngm--22.png"
                   alt="Camera" />
              <span class="text-message">여기로 파일을 드래그하거나 클릭하여 업로드하세요!</span>
            </div>
            <!-- + 아이콘은 별도로 분리해 계속 보여줌 -->
            <span class="plus">+</span>
          </div>
        </div>
        
        <!-- 선택된 썸네일 이미지 URL을 저장할 hidden input -->
        <input type="hidden" name="thumbnail" id="thumbnail" />

        <button type="submit" class="submit-btn">등록하기</button>
      </form>
    </div>
  </div>

  <script>
    // Quill 에디터 초기화
    var quill = new Quill('#editor-container', {
      theme: 'snow',
      modules: { imageResize: {} }
    });
    document.getElementById('editor-container').addEventListener('click', function () {
      quill.focus();
    });
    document.querySelector('form').onsubmit = function () {
      document.querySelector('#boardContent').value = quill.root.innerHTML;
    };

    let uploadedFiles = new Map();
    Dropzone.autoDiscover = false;

    const dropzone = new Dropzone('#dropzone', {
      url: '/board/upload', // 실제 업로드 서버 주소
      maxFiles: 5,
      maxFilesize: 5,
      acceptedFiles: 'image/*',
      addRemoveLinks: true,
      dictDefaultMessage: '', // 메시지는 .dz-message 내부에서 관리
      dictRemoveFile: '삭제',
      init: function () {
        this.on('addedfile', function (file) {
          let fileKey = file.name + file.size;
          if (uploadedFiles.has(fileKey)) {
            console.warn('중복된 파일입니다:', file.name);
            alert('이미 업로드된 파일입니다.');
            this.removeFile(file);
            return;
          }
          // 파일 추가 시 dz-started 클래스 부여 -> .dz-message 숨김
          this.element.classList.add('dz-started');
        });

        this.on('success', function (file, response) {
          console.log('업로드 완료:', response);
          let uploadedImageUrl = "";
          if (response && response.filePath) {
            uploadedImageUrl = response.filePath;
          } else {
            const reader = new FileReader();
            reader.onload = function (e) {
              uploadedImageUrl = e.target.result;
              insertImageToQuill(file, uploadedImageUrl);
            }.bind(this);
            reader.readAsDataURL(file);
            return;
          }
          insertImageToQuill(file, uploadedImageUrl);
        });

        this.on('error', function (file, errorMessage) {
          console.error('업로드 실패:', errorMessage);
        });

        this.on('removedfile', function (file) {
          console.log('Dropzone에서 파일 삭제됨:', file.name);
          let fileKey = file.name + file.size;
          let fileData = uploadedFiles.get(fileKey);
          if (fileData) {
            // Quill 에디터에서 해당 이미지 삭제
            let imgToRemove = quill.root.querySelector(`img[src="${fileData.url}"]`);
            if (imgToRemove) {
              imgToRemove.remove();
            }
          }
          uploadedFiles.delete(fileKey);

          // 모든 파일이 삭제되면 dz-started 클래스 제거 -> .dz-message 다시 표시
          if (this.files.length === 0) {
            this.element.classList.remove('dz-started');
          }

          // 썸네일 삭제 시 hidden input 초기화
          const currentThumbnail = document.getElementById('thumbnail').value;
          if (fileData && fileData.url === currentThumbnail) {
            document.getElementById('thumbnail').value = "";
          }
        });

        this.on('complete', function (file) {
          file.previewElement.classList.add('dz-complete');
        });
      }
    });

    function insertImageToQuill(file, uploadedImageUrl) {
      let range = quill.getSelection();
      let insertIndex = range ? range.index : quill.getLength();
      quill.insertEmbed(insertIndex, 'image', uploadedImageUrl);
      quill.setSelection(insertIndex + 1);

      let fileKey = file.name + file.size;
      uploadedFiles.set(fileKey, { file: file, url: uploadedImageUrl });

      file.previewElement.classList.add('dz-complete');

      let thumbnailLabel = document.createElement('div');
      thumbnailLabel.classList.add('thumbnail-label');
      thumbnailLabel.textContent = '썸네일로 지정';
      thumbnailLabel.style.display = 'none';
      file.previewElement.insertBefore(thumbnailLabel, file.previewElement.firstChild);

      file.previewElement.addEventListener('click', function(e) {
        if (e.target.classList.contains('dz-remove')) return;
        document.querySelectorAll('.dz-preview').forEach(function(preview) {
          preview.classList.remove('thumbnail-selected');
          let label = preview.querySelector('.thumbnail-label');
          if (label) { label.style.display = 'none'; }
        });
        file.previewElement.classList.add('thumbnail-selected');
        thumbnailLabel.style.display = 'block';
        document.getElementById('thumbnail').value = uploadedImageUrl;
        console.log('썸네일 지정:', uploadedImageUrl);
      });
    }

    // Quill 에디터에서 이미지 삭제 시 Dropzone 미리보기와 동기화
    quill.on('text-change', function () {
      let quillImages = new Set([...quill.root.querySelectorAll('img')].map(img => img.src));
      for (let [fileKey, fileData] of uploadedFiles.entries()) {
        if (!quillImages.has(fileData.url)) {
          console.log('Quill에서 이미지 삭제됨:', fileData.url);
          dropzone.removeFile(fileData.file);
          uploadedFiles.delete(fileKey);

          const currentThumbnail = document.getElementById('thumbnail').value;
          if (fileData.url === currentThumbnail) {
            document.getElementById('thumbnail').value = "";
          }
        }
      }
    });
  </script>
</body>
</html>
