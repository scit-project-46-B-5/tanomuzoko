<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 페이지</title>
    <link rel="stylesheet" href="../../static/css/login.css" th:href="@{/css/login.css}">
    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
    <script defer th:src="@{/js/login.js}"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.16.0/dist/sweetalert2.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.16.0/dist/sweetalert2.all.min.js"></script>
</head>

<body>
    <form th:action="@{/user/loginProc}" method="post">
        <div class="login-container">
            <div class="logo">
                <a href="../index.html" th:href="@{/}">
                    <img src="../../static/image/logo.png" th:src="@{/image/logo.png}" alt="Logo" />
                </a>
            </div>
             <!-- 🔹 로그인 실패 원인에 따라 메시지를 다르게 표시
                  🔹 숨겨진 errorType과 userId 필드 추가 -->
            <input type="hidden" id="errorType" th:value="${param.errorType ?: ''}">
            <input type="hidden" id="hiddenUserId" th:value="${param.userId ?: ''}">

            
            <input type="text" class="input-field" id="userId" name="userId" placeholder="아이디" />
            <input type="password" class="input-field" id="userPassword" name="userPassword" placeholder="비밀번호" />
            <button class="login-button" id="loginBtn">로그인</button>
            <div class="links">
                <a th:href="@{/user/idSearch}">계정 찾기</a> | <a th:href="@{/user/passwordSearch}">비밀번호 찾기</a> | <a th:href="@{/user/join}">회원가입</a>
            </div>
        </div>
    </form>
</body>

</html>
