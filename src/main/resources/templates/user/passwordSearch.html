<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 페이지지</title>
        <!-- 외부 API를 사용하기 위한 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.16.0/dist/sweetalert2.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.16.0/dist/sweetalert2.all.min.js"></script>
    <script defer th:src="@{/js/passwordSearch.js}"></script>
    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
</head>
<body>
    <h3>비밀번호 찾기 페이지</h3>
    <br>
    <form id="findForm" th:action="@{/user/find-password}" method="post">
        <div class="form-group">
            <label>아이디:
                <input type="text" name="userId" id="userId" placeholder="아이디">
            </label><br>
            <label>이메일:
                <input type="email" name="userEmail" id="userEmail" placeholder="이메일">
            </label>
        </div>
        <button type="submit" id="password-find">비밀번호 찾기</button>
        <button onclick="location.href= '@{/}'">홈으로 이동</button>
    </form>
</body>
</html>
